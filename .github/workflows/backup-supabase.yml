name: Weekly Supabase backup

# P1-DEVOPS-3 — Until we move to Supabase Pro (PITR), keep weekly
# off-site dumps in Cloudflare R2. RPO ≤ 7 days; cheap; immutable
# via R2 object lock if you set the bucket policy.
#
# Required GitHub Secrets:
#   SUPABASE_DB_URL          — postgres://… read-only role
#   R2_ACCESS_KEY_ID         — Cloudflare R2 S3-API access key
#   R2_SECRET_ACCESS_KEY     —                            secret
#   R2_ACCOUNT_ID            — Cloudflare account id
#   R2_BUCKET                — bucket name (e.g. bordik-backups)
#
# Verify locally:
#   gh workflow run backup-supabase.yml
#   gh run watch

on:
  schedule:
    - cron: '0 3 * * 0'        # Sunday 03:00 UTC
  workflow_dispatch: {}        # manual trigger from Actions tab

permissions:
  contents: read
  id-token: write              # for OIDC if you switch to it later

concurrency:
  group: backup-supabase
  cancel-in-progress: false    # never cancel a running backup

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Dump schema + data + roles
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p out
          supabase db dump --db-url "$DB_URL" --schema public --data-only > "out/data-${DATE}.sql"
          supabase db dump --db-url "$DB_URL" --schema public            > "out/schema-${DATE}.sql"
          supabase db dump --db-url "$DB_URL" --role-only                > "out/roles-${DATE}.sql"
          gzip out/*.sql

      - name: Compute checksums
        run: |
          set -euo pipefail
          cd out
          sha256sum *.gz > SHA256SUMS

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:             ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for f in out/*; do
            name=$(basename "$f")
            aws s3 cp "$f" "s3://${R2_BUCKET}/backups/${DATE}/${name}" \
              --endpoint-url "$ENDPOINT" \
              --no-progress
          done

      - name: Summary
        if: always()
        run: |
          echo "### Backup summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d out ]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            ls -lh out >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            cat out/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
