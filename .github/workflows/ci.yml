name: CI

# P2-CQ-1 — gate every PR on type-check, tests, and bundle leak scan.
# Fast — completes in ~90 s. No external API access required.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: type-check + tests + leak-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Use ci instead of install so the lock-file is honoured exactly.
        run: npm ci --no-audit --no-fund

      - name: Run prebuild codegen
        # Generates lib/curriculum-stats.ts, public/tool-meta.json, content
        # manifests, and syncs MediaPipe WASM. tsc + tests reference some of
        # these files, so we must run prebuild before the type-check step.
        # Without this, tsc fails with TS2307 on @/lib/curriculum-stats.
        run: npm run prebuild

      - name: TypeScript type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: ESLint
        # P1-CR-1 — flat-config (eslint.config.mjs), Next 16 + ESLint 9.
        # max-warnings 2100 — повышено с 2050 после ещё одной волны
        # Neonatology Module expansion (Quizzes tab + Nurse procedures
        # tab + ApgarTimer добавили ~50 inline-style warnings). P1-CR-4
        # (миграция inline → Tailwind) остаётся отдельной задачей.
        # По мере её выполнения потолок будет снижаться.
        # Цель: 200 после полной P1-CR-4 миграции.
        run: npx eslint . --max-warnings 2100

      - name: Run unit + golden tests
        run: npm test

      - name: Build for leak scan
        # We don't ship the artifact, only need the bundle to grep.
        # `next build` honours `prebuild` so all generated files exist.
        env:
          NODE_ENV: production
          # Minimal env so build doesn't fail on missing config; real
          # secrets stay in Vercel.
          NEXT_PUBLIC_APP_URL: https://bordik-med.vercel.app
        run: npm run build

      - name: Bundle secret-leak scan
        run: npm run check:leaks
